services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    # Dev mode: mount the source and auto-reload on changes.
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      # Healthy once migrations have run and the API answers (the worker waits for this).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    # Same image as the api, different command. Exec form so the worker is PID 1
    # and receives SIGTERM directly for a graceful shutdown.
    command: ["python", "-m", "worker.main"]
    volumes:
      - .:/app
    # Time to finish in-flight jobs before Docker force-kills it.
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"  # web UI: http://localhost:8025
      - "1025:1025"  # SMTP

  # Load tests. Not started by `docker compose up`; run on demand:
  #   docker compose run --rm k6 run /loadtests/noisy_neighbor.js
  k6:
    image: grafana/k6:0.54.0
    profiles: ["loadtest"]
    # keys.json is owner-only (it holds API keys); the image's default user can't read it.
    user: "0:0"
    environment:
      API_URL: http://api:8000
      K6_LOG_FORMAT: raw  # print the delivery report as a readable table

      # Only this one secret (read from .env): used to fetch delivery stats at the end.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
    volumes:
      - ./loadtests:/loadtests
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
